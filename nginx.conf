# hello-cicd — nginx on 8080, serving the runtime-rendered page from /tmp/html
server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root   /tmp/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
