<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hello-cicd</title>
  <style>
    body{margin:0;height:100vh;display:grid;place-items:center;
         font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
         background:#0f1117;color:#e6e6e6}
    .card{text-align:center;padding:40px 56px;border:1px solid #2a2e3a;border-radius:14px;background:#161a23}
    h1{margin:0 0 8px;font-size:34px}
    .v{color:#5fd3a6;font-size:18px}
    .sub{color:#8a8f9c;margin-top:14px;font-size:13px}
  </style>
</head>
<body>
  <div class="card">
    <h1>hello from the cluster 👋</h1>
    <!-- BUILD_VERSION is replaced by Jenkins at build time so each deploy is visibly distinct -->
    <div class="v">build: __BUILD_VERSION__</div>
    <div class="sub">Jenkins → JFrog → (manual tag bump) → ArgoCD → OpenShift</div>
  </div>
</body>
</html>
