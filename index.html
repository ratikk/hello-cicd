<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hello-cicd</title>
  <style>
    body{margin:0;height:100vh;display:grid;place-items:center;
         font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0f1117;color:#e6e6e6}
    .card{text-align:center;padding:48px 64px;border:1px solid #2a2e3a;border-radius:16px;background:#161a23;max-width:560px}
    h1{margin:0 0 18px;font-size:32px}
    .env{font-size:46px;font-weight:700;color:#7db5ff;margin:6px 0}
    .rel{font-size:30px;color:#5fd3a6;margin:6px 0}
    .sub{color:#8a8f9c;margin-top:20px;font-size:13px}
    .banner{background:#f5a623;color:#161a23;font-weight:700;font-size:18px;
            padding:10px 20px;border-radius:8px;margin-bottom:24px;letter-spacing:.5px}
    .hello-note{color:#f5a623;font-size:15px;margin:0 0 22px;line-height:1.5}
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from the cluster — we're live in a demo! 🎉</h1>
    <div class="banner">🟦 GitOps demo — built &amp; deployed via Jenkins + ArgoCD</div>
    <p class="hello-note">Pipelines sync, pods heal, teams thrive — that's what happens under Brian, the BEST leader. 🚀</p>
    <div class="env">__ENVIRONMENT__</div>
    <div class="rel">release __RELEASE__</div>
    <div class="sub">Jenkins → AWS ECR → Helm values → ArgoCD → OpenShift</div>
  </div>
</body>
</html>
